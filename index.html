<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DompetKu Pintar - Inuyasha Edition</title>
  
  <!-- Libraries: React, ReactDOM, Babel, Tailwind, Chart.js, FontAwesome, Google Fonts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            inuyasha: {
              purple: '#8b5cf6',
              deepPurple: '#4c1d95',
              softPurple: '#f3e8ff',
              indigo: '#6366f1',
              blue: '#3b82f6',
              sky: '#0ea5e9',
              softBlue: '#e0f2fe',
              red: '#ef4444',
              amber: '#f59e0b'
            }
          },
          fontFamily: {
            cute: ['Fredoka', 'sans-serif'],
            sans: ['Quicksand', 'sans-serif']
          },
          boxShadow: {
            cute: '0 8px 25px -5px rgba(139, 92, 246, 0.15), 0 4px 10px -6px rgba(59, 130, 246, 0.1)'
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 50%, #faf5ff 100%);
      background-attachment: fixed;
    }
    .font-cute {
      font-family: 'Fredoka', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes pulseSubtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .animate-pulse-subtle {
      animation: pulseSubtle 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper to format currency neatly
    const formatRupiah = (num) => {
      const val = Number(num) || 0;
      return 'Rp ' + val.toLocaleString('id-ID');
    };

    // Cute Shikon Jewel SVG Icon
    const ShikonJewelIcon = () => (
      <svg className="w-5 h-5 inline-block text-pink-400 drop-shadow animate-pulse" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
      </svg>
    );

    // Inuyasha Chibi Mascot Avatar
    const InuyashaAvatar = () => (
      <div className="relative w-12 h-12 sm:w-14 sm:h-14 bg-gradient-to-tr from-inuyasha-deepPurple to-inuyasha-purple rounded-2xl p-1 shadow-md shrink-0 flex items-center justify-center border-2 border-white">
        <div className="w-full h-full bg-slate-900 rounded-xl overflow-hidden relative flex items-center justify-center">
          {/* Silver Hair / Dog Ears */}
          <div className="absolute top-0.5 left-2 text-white text-xs font-bold font-cute">/\</div>
          <div className="absolute top-0.5 right-2 text-white text-xs font-bold font-cute">/\</div>
          {/* Cute Face */}
          <div className="text-xl">🐶</div>
          {/* Red Robe / Kotodama Beads Overlay */}
          <div className="absolute bottom-0 inset-x-0 h-3 bg-red-600 flex items-center justify-center text-[8px] text-amber-300 font-bold">
            ••••••
          </div>
        </div>
      </div>
    );

    function App() {
      const defaultWallets = ["BNI", "Bank Jatim", "BCA", "SeaBank", "Bank Jatim Junio", "Tunai"];

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('dompetku_script_url') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [hideBalance, setHideBalance] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Custom Delete Confirmation Modal State
      const [deleteModalTx, setDeleteModalTx] = useState(null);
      const [isDeleting, setIsDeleting] = useState(false);

      // Initial Default Transactions
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('dompetku_txs');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return [
          { id: 'tx_init_1', date: '2026-09-01', type: 'Pemasukan', wallet: 'BNI', category: 'Gaji / Pendapatan', amount: 5000000, notes: 'Gaji Bulanan' },
          { id: 'tx_init_2', date: '2026-09-02', type: 'Transfer', wallet: 'BNI ➔ SeaBank', category: 'Transfer Saldo', amount: 1500000, notes: 'Tabungan SeaBank' },
          { id: 'tx_init_3', date: '2026-09-05', type: 'Pemasukan', wallet: 'Bank Jatim Junio', category: 'Gaji / Pendapatan', amount: 500000, notes: 'Uang Saku Junio' },
          { id: 'tx_init_4', date: '2026-09-10', type: 'Pengeluaran', wallet: 'Tunai', category: 'Makanan & Minuman', amount: 75000, notes: 'Makan Malam Raman' }
        ];
      });

      // Filter States
      const [filterWallet, setFilterWallet] = useState('Semua');
      const [filterType, setFilterType] = useState('Semua');
      const [filterMonth, setFilterMonth] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');

      // Add Modal State
      const [showAddModal, setShowAddModal] = useState(false);
      const [modalType, setModalType] = useState('Pengeluaran');
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        wallet: 'BNI',
        walletTo: 'SeaBank',
        category: 'Makanan & Minuman',
        amount: '',
        notes: ''
      });

      // Chart Reference
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Save Local Storage
      useEffect(() => {
        localStorage.setItem('dompetku_txs', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('dompetku_script_url', scriptUrl);
      }, [scriptUrl]);

      const showNotification = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const syncFromSheets = async () => {
        if (!scriptUrl) {
          showNotification('⚠️ Masukkan URL Google Apps Script di menu Pengaturan dahulu!', 'warning');
          setShowSettings(true);
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(scriptUrl);
          const data = await res.json();
          if (data.status === 'success' && Array.isArray(data.transactions)) {
            setTransactions(data.transactions);
            showNotification('✅ Berhasil menyinkronkan data dengan Spreadsheet!', 'success');
          } else {
            showNotification('❌ Gagal membaca spreadsheet: ' + (data.message || 'Format tidak valid'), 'error');
          }
        } catch (err) {
          showNotification('❌ Gagal terhubung ke Spreadsheet: ' + err.message, 'error');
        } finally {
          setIsLoading(false);
        }
      };

      // Confirm & Delete Transaction
      const executeDeleteTransaction = async () => {
        if (!deleteModalTx) return;
        const tx = deleteModalTx;
        setIsDeleting(true);

        // Remove locally
        const previousTxs = [...transactions];
        setTransactions(prev => prev.filter(t => t.id !== tx.id));

        if (!scriptUrl) {
          showNotification('✅ Transaksi berhasil dihapus dari penyimpanan lokal!', 'success');
          setIsDeleting(false);
          setDeleteModalTx(null);
          return;
        }

        try {
          const payload = JSON.stringify({
            action: 'delete',
            id: tx.id,
            date: tx.date,
            type: tx.type,
            wallet: tx.wallet,
            category: tx.category,
            amount: tx.amount,
            notes: tx.notes
          });

          const response = await fetch(scriptUrl, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: payload
          });

          const result = await response.json();
          if (result.status === 'success') {
            showNotification('✅ Transaksi BERHASIL DIHAPUS dari Google Sheets!', 'success');
          } else {
            setTransactions(previousTxs);
            showNotification('❌ Gagal hapus di Sheets: ' + result.message, 'error');
          }
        } catch (err) {
          // Fallback via GET
          try {
            const queryParams = new URLSearchParams({
              action: 'delete',
              id: tx.id || '',
              date: tx.date || '',
              type: tx.type || '',
              wallet: tx.wallet || '',
              category: tx.category || '',
              amount: tx.amount || 0,
              notes: tx.notes || ''
            }).toString();

            const fallbackRes = await fetch(`${scriptUrl}?${queryParams}`);
            const fallbackData = await fallbackRes.json();
            if (fallbackData.status === 'success') {
              showNotification('✅ Transaksi BERHASIL DIHAPUS dari Google Sheets!', 'success');
            } else {
              setTransactions(previousTxs);
              showNotification('❌ Gagal hapus dari Spreadsheet', 'error');
            }
          } catch (e) {
            setTransactions(previousTxs);
            showNotification('❌ Koneksi terblokir. Pastikan Akses Web App "Anyone / Siapa Saja"', 'error');
          }
        } finally {
          setIsDeleting(false);
          setDeleteModalTx(null);
        }
      };

      // Handle Add Form Submit
      const handleAddSubmit = async (e) => {
        e.preventDefault();
        const numAmt = Number(formData.amount);
        if (!numAmt || numAmt <= 0) {
          showNotification('⚠️ Masukkan nominal transaksi yang valid!', 'warning');
          return;
        }

        let walletValue = formData.wallet;
        if (modalType === 'Transfer') {
          if (formData.wallet === formData.walletTo) {
            showNotification('⚠️ Rekening asal dan tujuan transfer tidak boleh sama!', 'warning');
            return;
          }
          walletValue = `${formData.wallet} ➔ ${formData.walletTo}`;
        }

        const newTx = {
          id: 'tx_local_' + Date.now(),
          date: formData.date,
          type: modalType,
          wallet: walletValue,
          category: modalType === 'Transfer' ? 'Transfer Saldo' : formData.category,
          amount: numAmt,
          notes: formData.notes
        };

        setTransactions(prev => [newTx, ...prev]);
        setShowAddModal(false);

        // Reset form
        setFormData({
          date: new Date().toISOString().split('T')[0],
          wallet: 'BNI',
          walletTo: 'SeaBank',
          category: 'Makanan & Minuman',
          amount: '',
          notes: ''
        });

        // Sync Add to Google Sheets
        if (scriptUrl) {
          try {
            showNotification('⏳ Menyimpan ke Google Sheets & memperbarui Rekap Saldo...', 'info');
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'add',
                ...newTx
              })
            });
            showNotification('✅ Transaksi & Rekap Saldo otomatis terbarui di Sheets!', 'success');
          } catch (err) {
            showNotification('⚠️ Tersimpan lokal, tetapi gagal terhubung ke Sheets', 'warning');
          }
        } else {
          showNotification('✅ Transaksi disimpan lokal!', 'success');
        }
      };

      const walletBalances = useMemo(() => {
        const balances = {};
        defaultWallets.forEach(w => balances[w] = 0);

        transactions.forEach(tx => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] += amt;
            else balances[tx.wallet] = amt;
          } else if (tx.type === 'Pengeluaran') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] -= amt;
            else balances[tx.wallet] = -amt;
          } else if (tx.type === 'Transfer' && tx.wallet.includes('➔')) {
            const [fromW, toW] = tx.wallet.split('➔').map(s => s.trim());
            if (balances[fromW] !== undefined) balances[fromW] -= amt;
            if (balances[toW] !== undefined) balances[toW] += amt;
          }
        });
        return balances;
      }, [transactions]);

      // Overall Totals
      const totalMetrics = useMemo(() => {
        let totalInc = 0;
        let totalExp = 0;
        transactions.forEach(tx => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') totalInc += amt;
          if (tx.type === 'Pengeluaran') totalExp += amt;
        });
        const grandTotal = Object.values(walletBalances).reduce((a, b) => a + b, 0);
        return { grandTotal, totalInc, totalExp };
      }, [transactions, walletBalances]);

      // Monthly Metrics
      const monthlyMetrics = useMemo(() => {
        const monthlyMap = {};
        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        transactions.forEach(tx => {
          if (!tx.date) return;
          const ym = String(tx.date).substring(0, 7);
          if (!ym || ym.length < 7) return;

          if (!monthlyMap[ym]) {
            monthlyMap[ym] = { income: 0, expense: 0, count: 0 };
          }

          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') {
            monthlyMap[ym].income += amt;
            monthlyMap[ym].count += 1;
          } else if (tx.type === 'Pengeluaran') {
            monthlyMap[ym].expense += amt;
            monthlyMap[ym].count += 1;
          }
        });

        const sortedMonths = Object.keys(monthlyMap).sort().reverse();

        return sortedMonths.map(ym => {
          const [year, monthStr] = ym.split('-');
          const monthIdx = parseInt(monthStr, 10) - 1;
          const label = `${monthNames[monthIdx] || monthStr} ${year}`;
          const inc = monthlyMap[ym].income;
          const exp = monthlyMap[ym].expense;
          return {
            ym,
            label,
            income: inc,
            expense: exp,
            net: inc - exp,
            count: monthlyMap[ym].count
          };
        });
      }, [transactions]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          const matchWallet = filterWallet === 'Semua' || tx.wallet.includes(filterWallet);
          const matchType = filterType === 'Semua' || tx.type === filterType;
          const matchMonth = filterMonth === 'Semua' || (tx.date && String(tx.date).startsWith(filterMonth));
          const query = searchQuery.toLowerCase();
          const matchSearch = !query || 
            (tx.notes && tx.notes.toLowerCase().includes(query)) ||
            (tx.category && tx.category.toLowerCase().includes(query)) ||
            (tx.wallet && tx.wallet.toLowerCase().includes(query));

          return matchWallet && matchType && matchMonth && matchSearch;
        });
      }, [transactions, filterWallet, filterType, filterMonth, searchQuery]);

      useEffect(() => {
        if (!chartRef.current) return;

        const categoryTotals = {};
        transactions.forEach(tx => {
          if (tx.type === 'Pengeluaran') {
            const cat = tx.category || 'Lainnya';
            categoryTotals[cat] = (categoryTotals[cat] || 0) + Number(tx.amount);
          }
        });

        const labels = Object.keys(categoryTotals);
        const data = Object.values(categoryTotals);

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['Belum Ada Pengeluaran'],
            datasets: [{
              data: data.length ? data : [1],
              backgroundColor: data.length ? [
                '#8b5cf6', '#3b82f6', '#0ea5e9', '#ec4899', '#f59e0b', '#10b981', '#6366f1', '#a855f7'
              ] : ['#e2e8f0'],
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  font: { family: 'Quicksand', size: 11, weight: '600' },
                  boxWidth: 12,
                  padding: 12
                }
              }
            },
            cutout: '65%'
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [transactions]);

      return (
        <div className="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
          
          {/* Floating Toast Notification */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-2xl shadow-2xl text-white font-semibold text-xs sm:text-sm flex items-center space-x-2.5 transition transform slide-in max-w-sm ${
              toast.type === 'error' ? 'bg-rose-600' :
              toast.type === 'warning' ? 'bg-amber-500' :
              toast.type === 'success' ? 'bg-emerald-600' : 'bg-indigo-900'
            }`}>
              <i className="fa-solid fa-circle-info text-lg"></i>
              <span className="leading-snug">{toast.msg}</span>
            </div>
          )}

          {/* Top Cute Header */}
          <header className="bg-white/90 backdrop-blur-md rounded-[2rem] p-4 sm:p-6 shadow-cute border-2 border-purple-100 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div className="flex items-center space-x-3.5 w-full md:w-auto">
              <InuyashaAvatar />
              <div className="min-w-0 flex-1">
                <div className="flex items-center space-x-2">
                  <h1 className="text-xl sm:text-2xl font-cute font-bold text-inuyasha-deepPurple tracking-wide truncate">
                    DompetKu Pintar
                  </h1>
                  <span className="bg-purple-100 text-inuyasha-purple text-[10px] font-bold px-2.5 py-0.5 rounded-full font-cute border border-purple-200">
                    Inuyasha Edition 🐾
                  </span>
                </div>
                <p className="text-xs text-slate-500 font-medium truncate mt-0.5">
                  Catat 6 Rekening &amp; Rekap Saldo Otomatis di Google Sheets
                </p>
              </div>
            </div>

            {/* Speech Bubble from Inuyasha */}
            <div className="hidden lg:flex bg-gradient-to-r from-purple-50 to-sky-50 text-inuyasha-deepPurple px-4 py-2 rounded-2xl border border-purple-200 text-xs font-semibold items-center space-x-2 animate-pulse-subtle max-w-xs shrink-0">
              <i className="fa-solid fa-comment-dots text-inuyasha-purple text-base"></i>
              <span className="leading-tight">"Kagome, rekap saldo bank &amp; tunai kita di Spreadsheet otomatis rapi!"</span>
            </div>

            {/* Header Buttons */}
            <div className="flex items-center gap-2 w-full md:w-auto justify-end flex-wrap">
              <button 
                onClick={syncFromSheets}
                disabled={isLoading}
                className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-cute font-bold flex items-center space-x-1.5 transition shadow-sm disabled:opacity-50"
              >
                <i className={`fa-solid fa-rotate ${isLoading ? 'animate-spin' : ''}`}></i>
                <span>{isLoading ? 'Sync...' : 'Sync Sheets'}</span>
              </button>

              <button 
                onClick={() => setHideBalance(!hideBalance)}
                className="bg-sky-50 hover:bg-sky-100 text-sky-700 px-3 py-2 rounded-xl text-xs font-cute font-bold transition border border-sky-200"
              >
                <i className={`fa-solid ${hideBalance ? 'fa-eye-slash' : 'fa-eye'} mr-1`}></i>
                {hideBalance ? 'Buka Saldo' : 'Tutup Saldo'}
              </button>

              <button 
                onClick={() => setShowSettings(true)}
                className="bg-purple-50 hover:bg-purple-100 text-inuyasha-purple p-2.5 rounded-xl text-xs font-bold transition border border-purple-200"
                title="Pengaturan Google Apps Script"
              >
                <i className="fa-solid fa-gear text-base"></i>
              </button>
            </div>
          </header>

          {/* Top Metrics Cards */}
          {}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            
            {/* Card 1: Total Kekayaan */}
            <div className="bg-gradient-to-br from-inuyasha-purple via-indigo-600 to-inuyasha-blue text-white p-5 rounded-[2rem] shadow-cute relative overflow-hidden border-2 border-white flex flex-col justify-between">
              <div className="absolute -right-3 -bottom-3 opacity-15 text-8xl pointer-events-none">💎</div>
              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-cute uppercase tracking-wider text-purple-200 font-bold">Total Kekayaan (6 Rekening)</span>
                  <ShikonJewelIcon />
                </div>
                <div className="text-2xl sm:text-3xl font-cute font-bold mt-2 tracking-wide text-amber-300 drop-shadow truncate" title={formatRupiah(totalMetrics.grandTotal)}>
                  {hideBalance ? 'Rp •••••••••' : formatRupiah(totalMetrics.grandTotal)}
                </div>
              </div>
              <p className="text-[11px] text-purple-100 font-medium mt-3 bg-black/10 px-3 py-1 rounded-full inline-block w-fit max-w-full truncate">
                🐾 Gabungan BNI, Jatim, BCA, SeaBank, Junio &amp; Tunai
              </p>
            </div>

            {/* Card 2: Total Pemasukan */}
            <div className="bg-white p-5 rounded-[2rem] shadow-cute border-2 border-sky-100 flex items-center justify-between hover:scale-[1.01] transition gap-2 min-w-0">
              <div className="min-w-0 flex-1">
                <span className="text-xs font-cute uppercase tracking-wider text-emerald-600 font-bold block truncate">Total Pemasukan</span>
                <div className="text-xl sm:text-2xl font-cute font-bold text-slate-800 mt-1 truncate" title={formatRupiah(totalMetrics.totalInc)}>
                  {hideBalance ? 'Rp •••••••••' : formatRupiah(totalMetrics.totalInc)}
                </div>
                <span className="text-[11px] text-slate-400 font-medium mt-1 block truncate">Seluruh riwayat transaksi</span>
              </div>
              <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-xl border border-emerald-200 shadow-sm shrink-0">
                <i className="fa-solid fa-arrow-down-left"></i>
              </div>
            </div>

            {/* Card 3: Total Pengeluaran */}
            <div className="bg-white p-5 rounded-[2rem] shadow-cute border-2 border-purple-100 flex items-center justify-between hover:scale-[1.01] transition gap-2 min-w-0">
              <div className="min-w-0 flex-1">
                <span className="text-xs font-cute uppercase tracking-wider text-rose-500 font-bold block truncate">Total Pengeluaran</span>
                <div className="text-xl sm:text-2xl font-cute font-bold text-slate-800 mt-1 truncate" title={formatRupiah(totalMetrics.totalExp)}>
                  {hideBalance ? 'Rp •••••••••' : formatRupiah(totalMetrics.totalExp)}

                    <span>Integrasi Google Sheets &amp; Apps Script</span>
                  </h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600 p-1">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block font-cute font-bold text-slate-800 mb-1">
                      URL Web App Google Apps Script
                    </label>
                    <input 
                      type="url"
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={scriptUrl}
                      onChange={(e) => setScriptUrl(e.target.value)}
                      className="w-full border border-purple-200 rounded-xl p-2.5 text-xs font-mono text-slate-800 focus:ring-2 focus:ring-purple-400 focus:outline-none"
                    />
                    <p className="text-[11px] text-slate-400 mt-1">
                      Tempelkan URL hasil deployment Web App Google Apps Script Anda di sini.
                    </p>
                  </div>

                  {/* Code Generator Box */}
                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="font-cute font-bold text-inuyasha-deepPurple">
                        📋 Kode Google Apps Script (Auto Rekap Saldo 6 Rekening &amp; Bulanan)
                      </span>
                      <button 
                        onClick={() => {
                          const gasCode = document.getElementById('gas-script-content').innerText;
                          const el = document.createElement('textarea');
                          el.value = gasCode;
                          document.body.appendChild(el);
                          el.select();
                          document.execCommand('copy');
                          document.body.removeChild(el);
                          showNotification('✅ Kode Apps Script disalin ke clipboard!', 'success');
                        }}
                        className="bg-purple-100 hover:bg-purple-200 text-inuyasha-deepPurple font-cute font-bold px-2.5 py-1 rounded-lg transition"
                      >
                        <i className="fa-solid fa-copy mr-1"></i> Salin Kode
                      </button>
                    </div>

                    <div className="bg-slate-900 text-emerald-400 p-3.5 rounded-2xl font-mono text-[10px] space-y-1 max-w-full overflow-hidden">
                      <div className="text-purple-300 text-[9px] font-sans font-bold uppercase mb-1">// Kode Google Apps Script Baru:</div>
                      <pre id="gas-script-content" className="whitespace-pre-wrap break-all max-w-full font-mono overflow-x-auto max-h-52 custom-scrollbar text-[10px] leading-relaxed text-emerald-300">{`function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName("Transaksi") || ss.getSheets()[0];
  var data = sheet.getDataRange().getValues();
  var txs = [];
  
  for (var i = 1; i < data.length; i++) {
    if (data[i][0]) {
      txs.push({
        id: data[i][0],
        date: formatDate(data[i][1]),
        type: data[i][2],
        wallet: data[i][3],
        category: data[i][4],
        amount: Number(data[i][5]),
        notes: data[i][6] || ""
      });
    }
  }
  return ContentService.createTextOutput(JSON.stringify({ status: "success", transactions: txs }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName("Transaksi");
  if (!sheet) {
    sheet = ss.insertSheet("Transaksi");
    sheet.appendRow(["ID", "Tanggal", "Tipe", "Rekening", "Kategori", "Jumlah", "Catatan"]);
  }
  
  var contents = JSON.parse(e.postData.contents);
  var action = contents.action;
  
  if (action === "add") {
    sheet.appendRow([
      contents.id,
      contents.date,
      contents.type,
      contents.wallet,
      contents.category,
      contents.amount,
      contents.notes
    ]);
  } else if (action === "delete") {
    var data = sheet.getDataRange().getValues();
    for (var i = data.length - 1; i >= 1; i--) {
      if (data[i][0] == contents.id) {
        sheet.deleteRow(i + 1);
        break;
      }
    }
  }
  
  updateRekapSheet(ss);
  return ContentService.createTextOutput(JSON.stringify({ status: "success" }))
    .setMimeType(ContentService.MimeType.JSON);
}

function updateRekapSheet(ss) {
  var rekapSheet = ss.getSheetByName("Rekap Saldo");
  if (!rekapSheet) {
    rekapSheet = ss.insertSheet("Rekap Saldo");
  } else {
    rekapSheet.clear();
  }
  
  var txSheet = ss.getSheetByName("Transaksi");
  if (!txSheet) return;
  var data = txSheet.getDataRange().getValues();
  
  var wallets = ["BNI", "Bank Jatim", "BCA", "SeaBank", "Bank Jatim Junio", "Tunai"];
  var balances = {};
  wallets.forEach(function(w) { balances[w] = 0; });
  
  for (var i = 1; i < data.length; i++) {
    var type = data[i][2];
    var wallet = data[i][3];
    var amt = Number(data[i][5]) || 0;
    
    if (type === "Pemasukan") {
      if (balances[wallet] !== undefined) balances[wallet] += amt;
    } else if (type === "Pengeluaran") {
      if (balances[wallet] !== undefined) balances[wallet] -= amt;
    } else if (type === "Transfer" && wallet.indexOf("➔") !== -1) {
      var parts = wallet.split("➔");
      var fromW = parts[0].trim();
      var toW = parts[1].trim();
      if (balances[fromW] !== undefined) balances[fromW] -= amt;
      if (balances[toW] !== undefined) balances[toW] += amt;
    }
  }
  
  rekapSheet.appendRow(["REKAP SALDO KESELURUHAN (AUTOMATIC)"]);
  rekapSheet.appendRow(["Nama Rekening / Dompet", "Saldo Saat Ini (Rp)"]);
  var grandTotal = 0;
  wallets.forEach(function(w) {
    rekapSheet.appendRow([w, balances[w]]);
    grandTotal += balances[w];
  });
  rekapSheet.appendRow(["TOTAL KEKAYAAN BERSIH", grandTotal]);
}

function formatDate(d) {
  if (d instanceof Date) {
    return Utilities.formatDate(d, Session.getScriptTimeZone(), "yyyy-MM-dd");
  }
  return d;
}`}</pre>
                    </div>
                  </div>

                  <div className="bg-purple-50 p-3 rounded-2xl border border-purple-100 text-[11px] text-slate-600 space-y-1">
                    <div className="font-cute font-bold text-inuyasha-deepPurple">📌 Langkah Memasang di Google Spreadsheet:</div>
                    <ol className="list-decimal pl-4 space-y-0.5">
                      <li>Buka Google Sheets, klik menu <b>Ekstensi &gt; Apps Script</b>.</li>
                      <li>Hapus kode bawaan, lalu tempelkan kode di atas.</li>
                      <li>Klik <b>Deploy &gt; New Deployment</b>. Pilih tipe <b>Web App</b>.</li>
                      <li>Set <i>Execute as: Me</i> &amp; <i>Who has access: Anyone</i>.</li>
                      <li>Salin URL Web App dan tempelkan pada kolom di atas!</li>
                    </ol>
                  </div>

                  <div className="flex justify-end pt-1">
                    <button 
                      onClick={() => {
                        setShowSettings(false);
                        showNotification('Pengaturan tersimpan!', 'success');
                      }}
                      className="px-5 py-2 bg-inuyasha-purple hover:bg-inuyasha-deepPurple text-white rounded-xl font-cute font-bold shadow-md transition"
                    >
                      Selesai &amp; Simpan
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
