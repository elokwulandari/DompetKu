<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DompetKu Pintar - Inuyasha Edition</title>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Fredoka & Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            fredoka: ['Fredoka', 'cursive'],
          },
          colors: {
            inuyasha: {
              red: '#ff4b6e',
              purple: '#8b5cf6',
              deepPurple: '#6d28d9',
              lightPurple: '#f3e8ff',
              blue: '#3b82f6',
              skyBlue: '#0ea5e9',
              softBlue: '#e0f2fe',
              gold: '#fbbf24',
            }
          },
          boxShadow: {
            'cute': '0 10px 25px -5px rgba(139, 92, 246, 0.25), 0 8px 10px -6px rgba(59, 130, 246, 0.2)',
            'cute-hover': '0 20px 30px -10px rgba(139, 92, 246, 0.35), 0 10px 15px -5px rgba(59, 130, 246, 0.3)',
            'pop': '0 8px 0px 0px rgba(109, 40, 217, 0.2)'
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: linear-gradient(135deg, #eef2ff 0%, #f3e8ff 50%, #e0f2fe 100%);
      min-height: 100vh;
    }
    .font-cute { font-family: 'Fredoka', cursive; }
    .glass-card { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f3e8ff; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c084fc; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a855f7; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-float { animation: float 3.5s ease-in-out infinite; }

    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .animate-pulse-subtle { animation: pulse-subtle 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="text-slate-800 antialiased pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // SVG Illustration: Cute Chibi Inuyasha Mascot
    const InuyashaChibi = ({ className = "w-24 h-24" }) => (
      <svg className={className} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        {/* Silver Luscious Long Hair Back */}
        <path d="M40 90C30 120 35 170 50 190C60 170 65 140 65 120Z" fill="#e2e8f0" />
        <path d="M160 90C170 120 165 170 150 190C140 170 135 140 135 120Z" fill="#e2e8f0" />
        <path d="M30 70C20 100 25 150 40 180" stroke="#cbd5e1" strokeWidth="4" strokeLinecap="round" />
        <path d="M170 70C180 100 175 150 160 180" stroke="#cbd5e1" strokeWidth="4" strokeLinecap="round" />
        
        {/* Cute Dog Ears */}
        {/* Left Ear */}
        <path d="M52 55C42 28 62 10 78 28C74 42 66 52 52 55Z" fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="3" />
        <path d="M58 48C52 34 64 22 72 32C70 40 65 46 58 48Z" fill="#f43f5e" opacity="0.6" />
        {/* Right Ear */}
        <path d="M148 55C158 28 138 10 122 28C126 42 134 52 148 55Z" fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="3" />
        <path d="M142 48C148 34 136 22 128 32C130 40 135 46 142 48Z" fill="#f43f5e" opacity="0.6" />

        {/* Chibi Head / Face */}
        <ellipse cx="100" cy="95" rx="52" ry="46" fill="#fff1f2" />
        <path d="M100 141C128 141 152 121 152 95C152 69 128 49 100 49C72 49 48 69 48 95C48 121 72 141 100 141Z" stroke="#fda4af" strokeWidth="2.5" />

        {/* Silver Hair Front Bangs */}
        <path d="M50 82C65 85 75 70 82 88C90 68 110 68 118 88C125 70 135 85 150 82C145 60 128 45 100 45C72 45 55 60 50 82Z" fill="#f8fafc" />
        <path d="M82 88C80 72 65 78 54 80" stroke="#cbd5e1" strokeWidth="2.5" strokeLinecap="round" />
        <path d="M118 88C120 72 135 78 146 80" stroke="#cbd5e1" strokeWidth="2.5" strokeLinecap="round" />

        {/* Cute Golden Anime Eyes */}
        <ellipse cx="78" cy="96" rx="8" ry="11" fill="#d97706" />
        <ellipse cx="122" cy="96" rx="8" ry="11" fill="#d97706" />
        <circle cx="76" cy="92" r="3.5" fill="white" />
        <circle cx="120" cy="92" r="3.5" fill="white" />
        <circle cx="80" cy="100" r="1.5" fill="white" />
        <circle cx="124" cy="100" r="1.5" fill="white" />

        {/* Eyebrows */}
        <path d="M70 81Q78 77 86 82" stroke="#475569" strokeWidth="2.5" strokeLinecap="round" />
        <path d="M114 82Q122 77 130 81" stroke="#475569" strokeWidth="2.5" strokeLinecap="round" />

        {/* Cute Blush */}
        <ellipse cx="68" cy="106" rx="7" ry="4" fill="#fb7185" opacity="0.5" />
        <ellipse cx="132" cy="106" rx="7" ry="4" fill="#fb7185" opacity="0.5" />

        {/* Cute Fang Smile */}
        <path d="M92 110Q100 118 108 110" stroke="#881337" strokeWidth="2.5" strokeLinecap="round" fill="none" />
        <path d="M104 110L106 114L108 110" fill="white" stroke="#881337" strokeWidth="1" />

        {/* Red Robe Kimono Body */}
        <path d="M60 135C50 145 42 170 38 190H162C158 170 150 145 140 135C125 145 75 145 60 135Z" fill="#ff4b6e" />
        {/* White Inner Collar */}
        <path d="M85 138L100 158L115 138" stroke="white" strokeWidth="5" strokeLinecap="round" fill="none" />
        <path d="M82 136L100 162L118 136" stroke="#ff4b6e" strokeWidth="3" fill="none" />

        {/* Kotodama Purple Magatama Beads Necklace */}
        <circle cx="75" cy="142" r="5" fill="#7c3aed" stroke="#f3e8ff" strokeWidth="1.5" />
        <circle cx="87" cy="149" r="5" fill="#7c3aed" stroke="#f3e8ff" strokeWidth="1.5" />
        <circle cx="100" cy="152" r="6" fill="#6d28d9" stroke="#f3e8ff" strokeWidth="1.5" />
        <circle cx="113" cy="149" r="5" fill="#7c3aed" stroke="#f3e8ff" strokeWidth="1.5" />
        <circle cx="125" cy="142" r="5" fill="#7c3aed" stroke="#f3e8ff" strokeWidth="1.5" />

        {/* Sparkles / Sacred Jewels around */}
        <path d="M30 40L33 46L40 49L33 52L30 58L27 52L20 49L27 46Z" fill="#fbbf24" />
        <path d="M170 35L172 40L178 42L172 44L170 50L168 44L162 42L168 40Z" fill="#a855f7" />
      </svg>
    );

    // Cute Shikon Shard / Jewel Icon
    const ShikonJewelIcon = () => (
      <span className="inline-block w-5 h-5 bg-gradient-to-tr from-purple-500 via-pink-400 to-sky-300 rounded-full animate-pulse shadow-md border border-white"></span>
    );

    function App() {
      // Settings & Config
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('dompetku_script_url') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [hideBalance, setHideBalance] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Custom Delete Modal State
      const [deleteModalTx, setDeleteModalTx] = useState(null);

      // 5 Rekening Milik Pengguna
      const defaultWallets = ["BNI", "Bank Jatim", "BCA", "SeaBank", "Bank Jatim Junio"];

      // Categories
      const categories = [
        "🍔 Makanan & Minuman",
        "🛒 Belanja & Kebutuhan",
        "🚗 Transportasi",
        "⚡ Tagihan & Utilitas",
        "🎬 Hiburan & Lifestyle",
        "📈 Investasi & Tabungan",
        "💰 Gaji & Pemasukan",
        "✨ Lain-lain"
      ];

      // Initial Transactions Data
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('dompetku_txs');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        const today = new Date().toISOString().split('T')[0];
        return [
          { id: 'tx_1', date: today, type: 'Pemasukan', wallet: 'BCA', category: '💰 Gaji & Pemasukan', amount: 6500000, notes: 'Gaji Bulanan Inuyasha' },
          { id: 'tx_2', date: today, type: 'Pengeluaran', wallet: 'BNI', category: '🍔 Makanan & Minuman', amount: 35000, notes: 'Ramen Instan & Dango' },
          { id: 'tx_3', date: today, type: 'Transfer', wallet: 'BCA ➔ Bank Jatim Junio', category: 'Transfer Saldo', amount: 1000000, notes: 'Tabungan Shikon Jewel' }
        ];
      });

      // Filter States
      const [filterWallet, setFilterWallet] = useState('Semua');
      const [filterType, setFilterType] = useState('Semua');
      const [filterMonth, setFilterMonth] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');

      // Add Modal State
      const [showAddModal, setShowAddModal] = useState(false);
      const [modalType, setModalType] = useState('Pengeluaran');
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        wallet: 'BNI',
        walletTo: 'SeaBank',
        category: '🍔 Makanan & Minuman',
        amount: '',
        notes: ''
      });

      // Chart Canvas Refs
      const categoryChartRef = useRef(null);
      const categoryChartInstance = useRef(null);
      const walletChartRef = useRef(null);
      const walletChartInstance = useRef(null);

      useEffect(() => {
        localStorage.setItem('dompetku_txs', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('dompetku_script_url', scriptUrl);
      }, [scriptUrl]);

      const showNotification = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const syncFromSheets = async () => {
        if (!scriptUrl) {
          showNotification('⚠️ Masukkan Web App URL Google Apps Script di menu Pengaturan dulu ya!', 'warning');
          setShowSettings(true);
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(scriptUrl);
          const data = await res.json();
          if (data.status === 'success' && Array.isArray(data.transactions)) {
            setTransactions(data.transactions);
            showNotification('✅ Osu! Data berhasil disinkronkan dari Google Sheets!', 'success');
          } else {
            showNotification('❌ Gagal membaca data: ' + (data.message || 'Format respon tidak valid'), 'error');
          }
        } catch (err) {
          showNotification('❌ Gagal terhubung ke Google Sheets: ' + err.message, 'error');
        } finally {
          setIsLoading(false);
        }
      };

      const confirmDeleteTransaction = async () => {
        if (!deleteModalTx) return;
        const tx = deleteModalTx;
        setDeleteModalTx(null);

        const previousTxs = [...transactions];
        setTransactions(prev => prev.filter(t => t.id !== tx.id));

        if (!scriptUrl) {
          showNotification('Hapus lokal berhasil! Tambahkan URL Apps Script untuk sinkron ke Sheets.', 'info');
          return;
        }

        try {
          showNotification('⏳ Menghapus transaksi dari Google Sheets...', 'info');
          
          const payload = JSON.stringify({
            action: 'delete',
            id: tx.id,
            date: tx.date,
            type: tx.type,
            wallet: tx.wallet,
            category: tx.category,
            amount: tx.amount,
            notes: tx.notes
          });

          const response = await fetch(scriptUrl, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: payload
          });

          const result = await response.json();

          if (result.status === 'success') {
            showNotification('✅ Transaksi berhasil dihapus dari Google Sheets!', 'success');
          } else {
            setTransactions(previousTxs);
            showNotification('❌ Gagal menghapus di Sheets: ' + result.message, 'error');
          }
        } catch (err) {
          console.error('Delete error:', err);
          showNotification('⚠️ Terhapus secara lokal. Cek izin "Anyone" pada Web App GAS Anda.', 'warning');
        }
      };

      const handleAddSubmit = async (e) => {
        e.preventDefault();
        const amt = Number(formData.amount);
        if (!amt || amt <= 0) {
          showNotification('⚠️ Masukkan nominal transaksi yang valid!', 'warning');
          return;
        }

        if (modalType === 'Transfer' && formData.wallet === formData.walletTo) {
          showNotification('⚠️ Rekening asal dan rekening tujuan tidak boleh sama!', 'warning');
          return;
        }

        let walletValue = formData.wallet;
        if (modalType === 'Transfer') {
          walletValue = `${formData.wallet} ➔ ${formData.walletTo}`;
        }

        const newTx = {
          id: 'tx_' + Date.now(),
          date: formData.date,
          type: modalType,
          wallet: walletValue,
          category: modalType === 'Transfer' ? 'Transfer Saldo' : formData.category,
          amount: amt,
          notes: formData.notes || '-'
        };

        setTransactions(prev => [newTx, ...prev]);
        setShowAddModal(false);

        // Reset form
        setFormData({
          date: new Date().toISOString().split('T')[0],
          wallet: 'BNI',
          walletTo: 'SeaBank',
          category: '🍔 Makanan & Minuman',
          amount: '',
          notes: ''
        });

        if (scriptUrl) {
          try {
            showNotification('⏳ Menyimpan transaksi ke Google Sheets...', 'info');
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'add',
                ...newTx
              })
            });
            showNotification('✅ Transaksi berhasil tersimpan ke Google Sheets!', 'success');
          } catch (err) {
            showNotification('⚠️ Disimpan secara lokal (Gagal terhubung ke Sheets)', 'warning');
          }
        } else {
          showNotification('✅ Transaksi berhasil tersimpan secara lokal!', 'success');
        }
      };

      const walletBalances = useMemo(() => {
        const balances = {};
        defaultWallets.forEach(w => balances[w] = 0);

        transactions.forEach(tx => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] += amt;
            else balances[tx.wallet] = amt;
          } else if (tx.type === 'Pengeluaran') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] -= amt;
            else balances[tx.wallet] = -amt;
          } else if (tx.type === 'Transfer' && tx.wallet.includes('➔')) {
            const [fromW, toW] = tx.wallet.split('➔').map(s => s.trim());
            if (balances[fromW] !== undefined) balances[fromW] -= amt;
            if (balances[toW] !== undefined) balances[toW] += amt;
          }
        });
        return balances;
      }, [transactions]);

      const totalMetrics = useMemo(() => {
        let totalInc = 0;
        let totalExp = 0;
        transactions.forEach(tx => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') totalInc += amt;
          if (tx.type === 'Pengeluaran') totalExp += amt;
        });
        const grandTotal = Object.values(walletBalances).reduce((a, b) => a + b, 0);
        return { grandTotal, totalInc, totalExp };
      }, [transactions, walletBalances]);

      const monthlyMetrics = useMemo(() => {
        const monthlyMap = {};
        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        transactions.forEach(tx => {
          if (!tx.date) return;
          const ym = String(tx.date).substring(0, 7);
          if (!ym || ym.length < 7) return;

          if (!monthlyMap[ym]) {
            monthlyMap[ym] = { income: 0, expense: 0, count: 0 };
          }

          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') {
            monthlyMap[ym].income += amt;
            monthlyMap[ym].count += 1;
          } else if (tx.type === 'Pengeluaran') {
            monthlyMap[ym].expense += amt;
            monthlyMap[ym].count += 1;
          }
        });

        const sortedMonths = Object.keys(monthlyMap).sort().reverse();

        return sortedMonths.map(ym => {
          const [year, monthStr] = ym.split('-');
          const monthIdx = parseInt(monthStr, 10) - 1;
          const label = `${monthNames[monthIdx] || monthStr} ${year}`;
          const inc = monthlyMap[ym].income;
          const exp = monthlyMap[ym].expense;
          return {
            ym,
            label,
            income: inc,
            expense: exp,
            net: inc - exp,
            count: monthlyMap[ym].count
          };
        });
      }, [transactions]);

      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          const matchWallet = filterWallet === 'Semua' || tx.wallet.includes(filterWallet);
          const matchType = filterType === 'Semua' || tx.type === filterType;
          const matchMonth = filterMonth === 'Semua' || (tx.date && String(tx.date).startsWith(filterMonth));
          const query = searchQuery.toLowerCase();
          const matchSearch = !query || 
            (tx.notes && tx.notes.toLowerCase().includes(query)) ||
            (tx.category && tx.category.toLowerCase().includes(query)) ||
            (tx.wallet && tx.wallet.toLowerCase().includes(query));

          return matchWallet && matchType && matchMonth && matchSearch;
        });
      }, [transactions, filterWallet, filterType, filterMonth, searchQuery]);

      useEffect(() => {
        // Doughnut Chart: Categories
        if (categoryChartRef.current) {
          const categoryTotals = {};
          transactions.filter(t => t.type === 'Pengeluaran').forEach(tx => {
            const cat = tx.category || '✨ Lain-lain';
            categoryTotals[cat] = (categoryTotals[cat] || 0) + Number(tx.amount);
          });

          const labels = Object.keys(categoryTotals);
          const data = Object.values(categoryTotals);

          if (categoryChartInstance.current) {
            categoryChartInstance.current.destroy();
          }

          const ctx = categoryChartRef.current.getContext('2d');
          categoryChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: labels.length ? labels : ['Belum Ada Pengeluaran'],
              datasets: [{
                data: data.length ? data : [1],
                backgroundColor: data.length ? [
                  '#8b5cf6', '#3b82f6', '#ec4899', '#06b6d4', '#f59e0b', '#10b981', '#6366f1', '#a855f7'
                ] : ['#e2e8f0'],
                borderWidth: 3,
                borderColor: '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { 
                legend: { position: 'bottom', labels: { font: { family: 'Plus Jakarta Sans', size: 11, weight: 'bold' } } } 
              }
            }
          });
        }

        // Bar Chart: Account Distribution
        if (walletChartRef.current) {
          if (walletChartInstance.current) {
            walletChartInstance.current.destroy();
          }

          const ctxW = walletChartRef.current.getContext('2d');
          walletChartInstance.current = new Chart(ctxW, {
            type: 'bar',
            data: {
              labels: defaultWallets,
              datasets: [{
                label: 'Saldo Rekening (Rp)',
                data: defaultWallets.map(w => walletBalances[w] || 0),
                backgroundColor: ['#6366f1', '#3b82f6', '#8b5cf6', '#0ea5e9', '#a855f7'],
                borderRadius: 12,
                borderWidth: 2,
                borderColor: '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { 
                y: { beginAtZero: true, grid: { color: '#f3e8ff' } },
                x: { grid: { display: false } }
              }
            }
          });
        }

        return () => {
          if (categoryChartInstance.current) categoryChartInstance.current.destroy();
          if (walletChartInstance.current) walletChartInstance.current.destroy();
        };
      }, [transactions, walletBalances]);

      const formatRupiah = (num) => 'Rp ' + Number(num || 0).toLocaleString('id-ID');

      return (
        <div className="max-w-7xl mx-auto px-4 py-6">
          
          {/* Cute Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3.5 rounded-2xl shadow-2xl text-white font-cute text-sm flex items-center space-x-3 transition-all animate-bounce ${
              toast.type === 'error' ? 'bg-rose-500' :
              toast.type === 'warning' ? 'bg-amber-500' :
              toast.type === 'success' ? 'bg-emerald-500' : 'bg-inuyasha-deepPurple'
            }`}>
              <i className="fa-solid fa-paw text-lg text-amber-300"></i>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Header Banner - Inuyasha Cute Theme */}
          <header className="bg-gradient-to-r from-inuyasha-deepPurple via-indigo-600 to-inuyasha-blue text-white rounded-[2.5rem] p-6 shadow-cute relative overflow-hidden mb-8 border-4 border-white/40">
            {/* Background Decorative Stars/Sakura */}
            <div className="absolute top-2 right-12 opacity-20 text-4xl animate-spin" style={{ animationDuration: '15s' }}>🌸</div>
            <div className="absolute bottom-1 left-1/3 opacity-20 text-3xl animate-bounce">✨</div>
            
            <div className="flex flex-col lg:flex-row justify-between items-center gap-6 relative z-10">
              
              {/* Left Side: Logo & Inuyasha Mascot */}
              <div className="flex items-center space-x-4">
                <div className="relative animate-float">
                  <InuyashaChibi className="w-24 h-24 sm:w-28 sm:h-28 drop-shadow-lg" />
                  <span className="absolute -bottom-1 -right-1 bg-amber-400 text-slate-900 text-[10px] font-cute px-2 py-0.5 rounded-full border-2 border-white font-bold">
                    Inuyasha 🐾
                  </span>
                </div>
                <div>
                  <div className="inline-flex items-center space-x-2 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-cute text-purple-100 mb-1 border border-white/30">
                    <ShikonJewelIcon />
                    <span>Asisten Keuangan Inuyasha</span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-cute font-bold tracking-wide text-white drop-shadow-sm">
                    DompetKu Pintar ✨
                  </h1>
                  <p className="text-xs text-purple-100 font-medium">

                <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto text-2xl border-2 border-rose-200">
                  <i className="fa-solid fa-trash-arrow-up"></i>
                </div>
                <h3 className="font-cute font-bold text-slate-800 text-base">Hapus Transaksi Ini?</h3>
                <p className="text-xs text-slate-500 leading-relaxed font-medium">
                  Yakin mau menghapus transaksi <span className="font-bold text-slate-700">"{deleteModalTx.notes || deleteModalTx.category}"</span> sebesar <span className="font-bold text-rose-500">{formatRupiah(deleteModalTx.amount)}</span>?
                </p>
                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => setDeleteModalTx(null)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-cute font-bold rounded-2xl transition"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={confirmDeleteTransaction}
                    className="flex-1 py-2.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-cute font-bold rounded-2xl shadow transition"
                  >
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: INTEGRATION SETTINGS */}
          {showSettings && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-[2.5rem] max-w-lg w-full p-6 shadow-2xl border-4 border-purple-200 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div className="flex justify-between items-center">
                  <h3 className="font-cute font-bold text-slate-800 text-lg flex items-center gap-2">
                    <i className="fa-solid fa-file-csv text-emerald-500"></i> Integrasi Google Sheets
                  </h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600 text-lg">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-600">
                  <label className="block font-cute font-bold text-slate-700">URL Web App Google Apps Script:</label>
                  <input 
                    type="url" 
                    placeholder="https://script.google.com/macros/s/.../exec"
                    value={scriptUrl}
                    onChange={e => setScriptUrl(e.target.value)}
                    className="w-full p-3 rounded-2xl border-2 border-purple-100 focus:outline-none focus:border-inuyasha-purple font-mono text-[11px]"
                  />
                  <p className="text-[11px] text-slate-400 font-medium">URL ini tersimpan di browser lokal Anda secara aman.</p>

                  <div className="bg-purple-50/80 p-3.5 rounded-2xl border-2 border-purple-100 space-y-2">
                    <span className="font-cute font-bold text-inuyasha-deepPurple block text-xs">Petunjuk Pemasangan Kode Apps Script:</span>
                    <ol className="list-decimal list-inside space-y-1 text-[11px] text-slate-700 font-medium">
                      <li>Buka Google Sheets baru &amp; pilih menu <b>Ekstensi &gt; Apps Script</b>.</li>
                      <li>Hapus kode bawaan lalu salin kode di bawah ini.</li>
                      <li>Klik <b>Deploy &gt; New deployment</b> &gt; Pilih Jenis: <b>Web app</b>.</li>
                      <li>Atur <i>Who has access</i> menjadi: <b>Anyone (Siapa Saja)</b>.</li>
                      <li>Salin Web App URL dan paste di kotak input atas.</li>
                    </ol>
                  </div>

                  <div className="bg-slate-900 text-emerald-400 p-3.5 rounded-2xl font-mono text-[10px] overflow-x-auto space-y-1">
                    <div className="text-purple-300 text-[9px] font-sans font-bold uppercase mb-1">// Kode Google Apps Script (Copypaste ke Sheets):</div>
                    <pre>{`function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = sheet.getDataRange().getValues();
  var transactions = [];
  for (var i = 1; i < data.length; i++) {
    if (data[i][0]) {
      transactions.push({
        id: data[i][0],
        date: data[i][1] instanceof Date ? data[i][1].toISOString().split('T')[0] : data[i][1],
        type: data[i][2],
        wallet: data[i][3],
        category: data[i][4],
        amount: Number(data[i][5]),
        notes: data[i][6]
      });
    }
  }
  return ContentService.createTextOutput(JSON.stringify({ status: 'success', transactions: transactions }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var contents = JSON.parse(e.postData.contents);
  if (contents.action === 'delete') {
    var data = sheet.getDataRange().getValues();
    for (var i = 1; i < data.length; i++) {
      if (data[i][0] == contents.id) {
        sheet.deleteRow(i + 1);
        return ContentService.createTextOutput(JSON.stringify({ status: 'success', message: 'Deleted' }))
          .setMimeType(ContentService.MimeType.JSON);
      }
    }
  } else {
    sheet.appendRow([
      contents.id || ('tx_' + new Date().getTime()),
      contents.date,
      contents.type,
      contents.wallet,
      contents.category,
      contents.amount,
      contents.notes
    ]);
    return ContentService.createTextOutput(JSON.stringify({ status: 'success', message: 'Added' }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`}</pre>
                  </div>

                  <button 
                    onClick={() => setShowSettings(false)}
                    className="w-full bg-inuyasha-purple hover:bg-inuyasha-deepPurple text-white font-cute font-bold py-3 rounded-2xl transition shadow-pop"
                  >
                    Simpan Pengaturan
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
